<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | The Sifted Cafe</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7efdd">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="The Sifted Cafe, home">
        <img src="assets/logo-wordmark.png" alt="the sifted" width="700" height="186">
        <span class="brand-tag">cafe &amp; bakery</span>
      </a>
      <a class="back-home" href="index.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to home
      </a>
    </div>
  </header>

  <main id="main" class="auth-main">
    <aside class="auth-photo on-dark" aria-hidden="true">
      <img src="assets/img/auth-login.jpg" alt="" width="900" height="1200">
      <p class="auth-photo-kicker">Cafe &amp; bakery &middot; Calamba &middot; Cabuyao</p>
      <p class="auth-photo-text">We sift out the rush and <em>keep the good moments.</em></p>
    </aside>
    <section class="auth-card" aria-labelledby="auth-title">
      <span class="eyebrow eyebrow-rule">Welcome back</span>
      <h1 id="auth-title">Log in</h1>
      <p class="auth-intro">Welcome back. Log in to reserve a table and see your reservations.</p>
      <div id="auth-status" class="form-status" aria-live="polite"></div>
      <form id="signin-form" class="auth-form" novalidate>
        <div class="field">
          <label for="signin-email">Email</label>
          <input id="signin-email" type="email" autocomplete="email" required inputmode="email" aria-describedby="err-signin-email" placeholder="Enter your email address">
          <p class="field-error" id="err-signin-email" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="signin-password">Password</label>
          <div class="pw-wrap">
            <input id="signin-password" type="password" autocomplete="current-password" required aria-describedby="err-signin-password" placeholder="Enter your password">
            <button type="button" class="pw-toggle" data-toggle-password="signin-password" aria-label="Show password" aria-pressed="false">
              <svg class="icon-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
          <p class="field-error" id="err-signin-password" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signin-submit">Log in</button>
      </form>
      <p class="auth-switch">No account yet? <a href="signup.html" id="to-signup">Sign up</a></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
